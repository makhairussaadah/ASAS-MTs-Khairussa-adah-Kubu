<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Kanji 2026/2027 - MTs Khairussa'adah Kubu</title>
    <style>
        :root {
            --primary-dark: #004d40;
            --primary-main: #00796b;
            --primary-light: #26a69a;
            --accent-color: #ffb300;
            --bg-gradient: linear-gradient(135deg, #00796b 0%, #004d40 100%);
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 440px;
            text-align: center;
            position: relative;
            overflow: hidden;
            animation: slideUp 0.5s ease-out;
        }

        /* Garis aksen warna-warni di atas card */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #00796b, #26a69a, #ffb300);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .school-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin: 0 auto 15px auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #f7f9f9;
            padding: 5px;
        }

        h2 {
            color: var(--primary-dark);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        h3 {
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 25px;
            font-size: 13px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 13px;
        }

        input, select {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafafa;
        }

        input:focus, select:focus {
            border-color: var(--primary-main);
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0, 121, 107, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-main), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0, 121, 107, 0.3);
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 121, 107, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #7f8c8d, #636e72);
            box-shadow: 0 4px 12px rgba(127, 140, 141, 0.3);
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        .error-msg {
            color: #c0392b;
            font-size: 13px;
            margin-top: 15px;
            background-color: #fadbd8;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #f5b7b1;
            font-weight: 500;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- 1. Halaman Login -->
    <div id="login-page" class="card">
        <!-- Logo Sekolah (Pastikan file logo-mts.png berada di folder yang sama di GitHub) -->
        <img src="logo-mts.png" alt="Logo MTs Khairussa'adah" class="school-logo" onerror="this.style.display='none'">
        
        <h2>MTs KHAIRUSSA'ADAH KUBU</h2>
        <h3>Sumatif Akhir Semester (SAS) Ganjil<br>Tahun Ajaran 2026/2027</h3>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nama Lengkap</label>
                <input type="text" id="username" placeholder="Masukkan nama lengkap Anda" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="text" id="password" placeholder="Masukkan password ujian" required>
            </div>
            <button type="submit" id="btn-login">Masuk Ujian</button>
            <div id="error-message" class="error-msg hidden">Nama atau Password salah. Periksa kembali!</div>
        </form>
    </div>

    <!-- 2. Halaman Pilih Kelas -->
    <div id="selection-page" class="card hidden">
        <img src="logo-mts.png" alt="Logo MTs Khairussa'adah" class="school-logo" onerror="this.style.display='none'">
        
        <h2>PILIH KELAS UJIAN</h2>
        <h3>Silahkan pilih kelas Anda untuk melanjutkan ke soal</h3>

        <div class="form-group">
            <label for="kelas">Kelas</label>
            <select id="kelas">
                <option value="">-- Pilih Kelas Anda --</option>
                <option value="VII">Kelas VII</option>
                <option value="VIII">Kelas VIII</option>
                <option value="IX">Kelas IX</option>
            </select>
        </div>

        <button type="button" onclick="bukaSoal()">Buka Soal Ujian</button>
        <button type="button" class="btn-secondary" onclick="logout()">Keluar Akun</button>
    </div>

    <script>
        // Ganti dengan URL Web App dari Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzygNDA0itEY4gQ4VOY42Ped5XaAhXVnX5oz6kyOQI2L1u5fyG1d_UDkONLMrw8yQ/exec";

        // Data Tautan Google Form Soal Ujian per Kelas
        const linkSoal = {
            "VII": "https://forms.gle/CRQN5WjCUNe3g47S6",
            "VIII": "https://forms.gle/32u3qi6D2JyWGtpk6",
            "IX": "https://forms.gle/Mt1GhKmWQwbEJ4P16"
        };

        // Proses Login Mengecek ke Google Sheets
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            const btnLogin = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.add('hidden');
            btnLogin.classList.add('loading');
            btnLogin.innerText = "Memeriksa Akun...";

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                btnLogin.classList.remove('loading');
                btnLogin.innerText = "Masuk Ujian";

                if (data.status === true) {
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('selection-page').classList.remove('hidden');
                } else {
                    errorMsg.classList.remove('hidden');
                }
            })
            .catch(error => {
                btnLogin.classList.remove('loading');
                btnLogin.innerText = "Masuk Ujian";
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi internet.');
            });
        });

        // Pengarahan ke Google Form Berdasarkan Kelas
        function bukaSoal() {
            const kelas = document.getElementById('kelas').value;

            if (!kelas) {
                alert("Silahkan pilih Kelas terlebih dahulu!");
                return;
            }

            const targetURL = linkSoal[kelas];
            window.location.href = targetURL;
        }

        // Fungsi Logout
        function logout() {
            document.getElementById('selection-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('kelas').value = '';
            document.getElementById('error-message').classList.add('hidden');
        }
    </script>
</body>
</html>
