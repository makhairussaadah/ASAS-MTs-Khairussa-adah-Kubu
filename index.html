<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAS Kanji 2026/2027 - MTs Khairussa'adah Kubu</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            color: #1b5e20;
            margin-bottom: 8px;
            font-size: 20px;
        }
        h3 {
            color: #555;
            font-weight: 400;
            margin-bottom: 20px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #1b5e20;
        }
        .hidden {
            display: none;
        }
        .error-msg {
            color: #d32f2f;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- 1. Halaman Login -->
    <div id="login-page" class="card">
        <h2>MTs KHAIRUSSA'ADAH KUBU</h2>
        <h3>Sumatif Akhir Semester (SAS) Ganjil<br>Tahun Ajaran 2026/2027</h3>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Nama Lengkap</label>
                <input type="text" id="username" placeholder="Masukkan Nama Lengkap Anda" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan Password" required>
            </div>
            <button type="submit">Masuk</button>
            <p id="error-message" class="error-msg hidden">Nama atau Password salah!</p>
        </form>
    </div>

    <!-- 2. Halaman Pilih Kelas Saja -->
    <div id="selection-page" class="card hidden">
        <h2>PILIH KELAS UJIAN</h2>
        <h3>Silahkan pilih Kelas Anda</h3>

        <div class="form-group">
            <label for="kelas">Kelas</label>
            <select id="kelas">
                <option value="">-- Pilih Kelas --</option>
                <option value="VII">Kelas VII</option>
                <option value="VIII">Kelas VIII</option>
                <option value="IX">Kelas IX</option>
            </select>
        </div>

        <button type="button" onclick="bukaSoal()">Buka Soal Ujian</button>
        <button type="button" onclick="logout()" style="background-color: #757575; margin-top: 8px;">Keluar</button>
    </div>

    <script>
        // Ganti dengan URL Web App dari Google Apps Script Anda
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzygNDA0itEY4gQ4VOY42Ped5XaAhXVnX5oz6kyOQI2L1u5fyG1d_UDkONLMrw8yQ/exec";

        // Data Tautan Google Form Soal Ujian per Kelas
        const linkSoal = {
            "VII": "https://forms.gle/CRQN5WjCUNe3g47S6",
            "VIII": "https://forms.gle/32u3qi6D2JyWGtpk6",
            "IX": "https://forms.gle/Mt1GhKmWQwbEJ4P16"
        };

        // Proses Login Mengecek ke Google Sheets
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            const errorMsg = document.getElementById('error-message');
            errorMsg.classList.add('hidden');

            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify({ username: user, password: pass })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === true) {
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('selection-page').classList.remove('hidden');
                } else {
                    errorMsg.classList.remove('hidden');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Terjadi kesalahan koneksi.');
            });
        });

        // Pengarahan ke Google Form Berdasarkan Kelas
        function bukaSoal() {
            const kelas = document.getElementById('kelas').value;

            if (!kelas) {
                alert("Silahkan pilih Kelas terlebih dahulu!");
                return;
            }

            const targetURL = linkSoal[kelas];
            window.location.href = targetURL;
        }

        // Fungsi Logout
        function logout() {
            document.getElementById('selection-page').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('error-message').classList.add('hidden');
        }
    </script>
</body>
</html>
